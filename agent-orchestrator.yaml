port: 3000

defaults:
  runtime: tmux
  agent: claude-code
  workspace: worktree
  notifiers:
    - desktop

projects:
  macd-cycle-analysis:
    repo: wookooner/macd_cycle_analysis_project
    path: C:/path/to/macd_cycle_analysis_project
    defaultBranch: main
    sessionPrefix: macd

policies:
  pathPriority:
    - MACD_DATA_ROOT
    - configs/paths.yaml
    - repo fallback
  keepRepoCodeOnly: true
  protectHumanOwnedSemantics: true

notes:
  - Replace projects.macd-cycle-analysis.path with your local clone path.
  - Keep raw data, outputs, reports, and logs outside Git.
  - Use worktree-based issue branches for parallel agent execution.
  - Do not assign labeling or strategy-definition changes to agents.
