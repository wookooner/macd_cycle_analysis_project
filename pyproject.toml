[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macd-cycle-analysis"
version = "0.1.0"
description = "Code-first MACD cycle analysis research repository."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pandas>=2.0.0",
  "numpy>=1.26.0",
  "pyarrow>=14.0.0",
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
  "binance-connector>=3.8.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["src*", "data_pipeline*", "trading_bot*"]
